name: Docker Image CI

on:
  push:
    branches: 
      - shir-tunik
      - dev
  pull_request:
    branches: [ "shir-tunik" ]
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
